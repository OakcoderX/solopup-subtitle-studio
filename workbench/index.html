  });
  const stopAudio=()=>{if(soundSyncLock||activeSoundAudio!==audio)return;soundSyncLock=true;video.pause();video.muted=soundVideoWasMuted;activeSoundAudio=null;soundSyncLock=false;};
  audio.addEventListener('pause',stopAudio);audio.addEventListener('ended',stopAudio);
  card.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{let v=soundDecisions[id]||{};v.status=btn.dataset.choice;v.reviewer='human';v.humanApproved=true;v.uncertain=false;v.caption=card.querySelector('.caption').value;v.note=card.querySelector('.note').value;soundDecisions[id]=v;card.dataset.status=v.status;card.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('on',x===btn));card.querySelector('.soundHead b').textContent=v.caption;card.querySelector('.tag').textContent=({ 'zh-CN':'人工判断',en:'Human decision',ko:'사람의 판단',ja:'人による判断'}[uiLocale]);soundChanged()});
  card.querySelector('[data-seek]').onclick=()=>{stopLinkedSound();video.currentTime=Number(row.start);video.pause()};
  card.querySelector('.caption').oninput=()=>{if(soundDecisions[id])soundDecisions[id].caption=card.querySelector('.caption').value;card.querySelector('.soundHead b').textContent=card.querySelector('.caption').value;soundChanged()};
  card.querySelector('.note').oninput=()=>{if(soundDecisions[id])soundDecisions[id].note=card.querySelector('.note').value;soundChanged()};

}
async function saveSounds(){if(!soundDirty)return true;try{let r=await apiFetch('/api/review',{method:'POST',headers:soundHeaders(),body:JSON.stringify(soundDecisions)});if(!r.ok)throw Error(r.status===409||r.status===428?'conflict':'save');let result=await r.json();soundToken=result.soundToken;soundDirty=false;soundNeedsCompose=true;soundSaveState.textContent=ui('soundSaved');return true}catch(e){soundSaveState.textContent=e.message==='conflict'?'本集已有新版，请刷新后核对；当前修改未覆盖新版':ui('soundSaveFailed');return false}}

function parseSrtText(raw){let text=raw.replace(/^\uFEFF/,'').replace(/^WEBVTT[^\n]*\n/i,'');let blocks=text.trim().split(/\r?\n\s*\r?\n/),out=[];for(const block of blocks){let m=block.match(/(?:^|\n)(\d{2,}:\d{2}:\d{2}[,.]\d{1,3})\s*-->\s*(\d{2,}:\d{2}:\d{2}[,.]\d{1,3})(?:[^\n]*)\n([\s\S]*)/);if(!m)continue;let start=parseStamp(m[1]),end=parseStamp(m[2]),body=m[3].trim().replace(/<[^>]+>/g,'');if(Number.isFinite(start)&&end>start&&body)out.push({id:`I${String(out.length+1).padStart(3,'0')}`,start,end,text:body,checked:false})}return out}

// External subtitle updates: never silently discard a local draft.
function externalStateAction(current, remote, hasDraft){
 if(!remote || !Array.isArray(remote.standard) || !Array.isArray(remote.sdh) || !remote._saveToken || !current._saveToken || remote._saveToken===current._saveToken)return 'none';
 return hasDraft?'warn':'adopt';
}
let externalStateBusy=false;
async function adoptExternalState(remote){
 const selectedId=cues()[active]?.id;

 const index=cues().findIndex(c=>c.id===selectedId);active=index>=0?index:-1;
 const notice=document.getElementById('externalStateNotice');if(notice)notice.remove();

 await refreshQualityGate();await preflight();
}
async function checkExternalState(){

 try{
  const response=await apiFetch('/api/state');if(!response.ok)return;

  if(action==='adopt'){await adoptExternalState(remote);toast(uiLocale==='zh-CN'?'已载入后台更新的字幕':'Updated subtitles loaded');}
  if(action==='warn'){
   let notice=document.getElementById('externalStateNotice');
   if(!notice){notice=document.createElement('button');notice.id='externalStateNotice';notice.type='button';notice.setAttribute('role','alert');notice.style.cssText='background:#8a3f12;color:white;border:2px solid #ffcf70;padding:7px 12px;font-weight:bold;';document.querySelector('header.top').appendChild(notice);}
   notice.textContent=uiLocale==='zh-CN'?'后台字幕已更新 · 当前是旧版本 · 备份草稿并载入新版':'Subtitles updated · back up draft and load latest';
   notice.onclick=async()=>{
    try{
     const key='subtitle-draft-before-refresh-'+document.body.dataset.episode+'-'+Date.now();
     localStorage.setItem(key,JSON.stringify({state,soundDecisions,soundDirty,track,at:new Date().toISOString()}));
     const latest=await apiFetch('/api/state');if(!latest.ok)throw Error('load');
     const fresh=await latest.json();if(!Array.isArray(fresh.standard)||!Array.isArray(fresh.sdh)||!fresh._saveToken)throw Error('shape');
     await adoptExternalState(fresh);soundDirty=false;await loadSoundStage();toast(uiLocale==='zh-CN'?'草稿已备份，已载入新版字幕':'Draft backed up; latest subtitles loaded');
    }catch(error){toast(uiLocale==='zh-CN'?'未能安全备份或载入，当前修改已保留':'Could not back up or load; local edits retained');}
   };
  }
 }catch(error){}finally{externalStateBusy=false;}
}
