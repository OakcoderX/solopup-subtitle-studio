<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>字幕工作台 · 项目与制作</title><link rel="stylesheet" href="/assets/project_hub.css?v=1"></head><body><header><div><small>SoloPup Subtitle Studio</small><h1>项目与制作</h1></div><span>项目规则独立 · 制作队列统一 · 审核进度保留</span><button id="newProject">新建项目</button><button id="linkLibrary">关联已有项目库</button><button id="providerSetup">AI接口设置</button></header><main><aside><h2>项目库</h2><div id="projects"></div></aside><section class="workspace"><div id="projectIntro"></div><div class="tools"><button id="addEpisodes" class="primary">添加剧集</button><select id="format" aria-label="项目导出格式"><option value="itt">ITT</option><option value="srt">SRT</option></select><button id="exportProject">导出本项目字幕</button><span id="queueStatus"></span></div><div id="episodes"></div></section></main><dialog id="createDialog"><h2>新建字幕项目</h2><form id="createForm"><label>项目名称<input id="name" required maxlength="100" autocomplete="off"></label><label>制作方式<select id="workflow" aria-label="制作方式"><option value="sdh">原声字幕与SDH</option><option value="bilingual">中文配音 → 中英双语字幕</option></select></label><label>英文地区<select id="language" aria-label="英文地区"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select></label><label>受众<select id="audience" aria-label="受众"><option value="children">儿童</option><option value="adult">成人</option></select></label><label id="editRateRow" hidden>字幕校准帧率<select id="editRate" aria-label="字幕校准帧率"><option value="source">跟随原视频</option><option value="25">25帧</option><option value="24">24帧</option><option value="30">30帧</option><option value="50">50帧</option><option value="60">60帧</option></select></label><p id="policyHint"></p><div class="actions"><button type="button" data-close="createDialog">取消</button><button type="submit" class="primary">创建项目</button></div></form><p class="error" id="createError"></p></dialog><dialog id="batchDialog"><h2>添加剧集</h2><p id="importHint"></p><div class="tools"><button id="chooseVideos">选择视频（1—5集）</button><input type="file" id="videos" accept=".mp4,.mov,.m4v,.mkv" multiple hidden></div><details><summary>或填写本机视频路径</summary><textarea id="paths" rows="3" placeholder="每行一个完整的视频文件路径"></textarea><button id="usePaths">使用这些路径</button></details><div id="batchRows"></div><p id="uploadStatus"></p><p class="error" id="batchError"></p><div class="actions"><button data-close="batchDialog">取消</button><button id="enqueue" class="primary">加入后台制作队列</button></div></dialog><dialog id="linkDialog"><h2>关联已有项目库</h2><p>读取原项目的索引，字幕和审核记录保留在原位置。关联本身不启动制作任务。</p><label>项目库文件夹完整路径<input id="libraryRoot" placeholder="包含 library.sqlite3 的文件夹"></label><p class="error" id="linkError"></p><div class="actions"><button data-close="linkDialog">取消</button><button id="confirmLink" class="primary">关联</button></div></dialog><dialog id="providerDialog"><h2>AI接口设置</h2><p id="providerStatus"></p><p>密钥只保存于本机；保存不发起识别或翻译请求。</p><label>接口地址<input id="providerUrl" type="url"></label><label>声音模型<input id="providerAudio"></label><label>文字翻译模型<input id="providerText"></label><label>密钥<input id="providerKey" type="password" autocomplete="new-password"></label><p class="error" id="providerError"></p><div class="actions"><button data-close="providerDialog">取消</button><button id="saveProvider" class="primary">保存到本机</button></div></dialog><div id="toast" role="status"></div><script src="/assets/project_hub.js?v=1"></script><script src="/assets/provider_onboarding.js?v=1"></script></body></html>
